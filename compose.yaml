services:
  server:
    image: ledsim-server:latest
    build: .
    restart: unless-stopped
    environment:
      MAX_SKETCH_FILES: ${MAX_SKETCH_FILES:-64}
      MAX_SKETCH_BYTES: ${MAX_SKETCH_BYTES:-1048576}
    volumes:
      - projects:/home/builder/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    # Not published: only reachable through the web service's /api proxy.

  web:
    image: ledsim-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  projects:
