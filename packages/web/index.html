<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AVR8js NeoPixels + FastLED</title>
    <script>
      // Apply the theme before the first paint (the app keeps it in sync afterwards).
      try {
        const pref = JSON.parse(localStorage.getItem("ledsim.theme") ?? '"system"');
        const dark =
          pref === "dark" ||
          (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        // Storage blocked: the app sets the theme once it starts.
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
