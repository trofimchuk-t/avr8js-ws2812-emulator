# Runs prebuilt images (loaded with `docker load`), no source code needed.
# Copy this file next to ledsim-images.tar on the target machine.
services:
  server:
    image: ledsim-server:latest
    restart: unless-stopped
    volumes:
      - projects:/home/builder/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  web:
    image: ledsim-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  projects:
